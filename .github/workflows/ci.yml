name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Run Ruff Lint
        run: pixi run ruff check .

      - name: Run Ruff Format Check
        run: pixi run ruff format --check .

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Run Pytest Test Suite
        run: pixi run pytest -v -m "not external"

      - name: Run CLI Smoke Tests
        run: |
          pixi run cargofinder --help
          pixi run cargofinder fetch-profiles --help
          pixi run cargofinder run --help
