[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cargofinder"
version = "0.1.0"
description = "Discovery and ranking of encapsulin cargo candidates from bacterial and archaeal genomes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abdulbaki Erkan" }
]
keywords = ["encapsulin", "nanocompartment", "cargo", "bioinformatics", "targeting-peptide", "HK97"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pyhmmer>=0.10.0",
    "pyrodigal>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
cargofinder = "cargofinder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cargofinder"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "external: marks tests requiring external tools (mmseqs2) or network access",
]
